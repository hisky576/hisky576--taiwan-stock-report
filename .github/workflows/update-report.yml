name: Update Taiwan Stock Report Daily

on:
  schedule:
    # Runs every day at 17:00 (5 PM) GMT+8
    - cron: '0 9 * * *' # 9 AM UTC is 5 PM GMT+8
  workflow_dispatch:

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run update script
      run: python update_report.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff --staged --quiet || git commit -m "Daily update: Taiwan Stock Report for $(date +'%Y/%m/%d')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
